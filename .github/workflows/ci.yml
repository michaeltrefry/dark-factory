name: CI

on:
  push:
    branches: [main, "feature/**"]
  pull_request:

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: public.ecr.aws/docker/library/postgres:17
        env:
          POSTGRES_USER: factory
          POSTGRES_PASSWORD: factory
          POSTGRES_DB: factory
        ports:
          - 5434:5432
        options: >-
          --health-cmd "pg_isready -U factory -d factory"
          --health-interval 2s --health-timeout 3s --health-retries 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet tool restore
      - name: Build (fails on the gateway lint, sc-25390)
        run: dotnet build
      - name: Apply ledger migrations to a fresh Postgres
        run: dotnet ef database update --project src/DarkFactory.Orchestrator --no-build
      - name: Test (incl. the lint's seeded-violation tests and the gate-check coverage; live acceptance tests skip without FACTORY_E2E=1)
        run: dotnet test --no-build
