# Install the rendered RemoteIosWorkflow.Text, not this source template. The factory
# expands FACTORY_RUNNER from its embedded helper, and requires an exact match.
name: Factory iOS new tests
run-name: factory-ios-${{ inputs.nonce }}
on:
  workflow_dispatch:
    inputs:
      nonce:
        required: true
        type: string
      base:
        required: true
        type: string
      head:
        required: true
        type: string
      tests:
        required: true
        type: string
      execution:
        default: ''
        type: string
      execution_budget_seconds:
        default: ''
        type: string
      execution_deadline_unix_seconds:
        default: ''
        type: string
permissions: {}
jobs:
  sources:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      sides: ${{ steps.plan.outputs.sides }}
    steps:
      - name: Select requested execution side
        id: plan
        env:
          EXECUTION: ${{ inputs.execution }}
        run: |
          python3 -I - <<'PY'
          import json, os
          execution = os.environ['EXECUTION']
          sides = ['base', 'head']
          if execution:
              parsed = json.loads(execution)
              side = parsed['side']
              if side not in ('base', 'head'):
                  raise ValueError('invalid execution side')
              sides = [side]
              # The opposite archive is needed only when this execution's overlay copies from the other revision.
              if parsed.get('overlayPaths') and parsed.get('overlayFrom') != parsed.get('commit'):
                  sides.append('head' if side == 'base' else 'base')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('sides=' + json.dumps(sides) + '\n')
          PY
      # No checkout and no repository code in the credentialed job. Only immutable
      # source archives cross into the execution job; the gate token never does.
      - name: Acquire source archives
        env:
          GH_TOKEN: ${{ github.token }}
          API: ${{ github.api_url }}
          REPO: ${{ github.repository }}
          BASE: ${{ inputs.base }}
          HEAD: ${{ inputs.head }}
          SIDES: ${{ steps.plan.outputs.sides }}
        run: |
          python3 -I - <<'PY'
          import json, os, re, urllib.request
          os.mkdir('sources')
          sides = json.loads(os.environ['SIDES'])
          if not isinstance(sides, list) or not sides or len(sides) > 2 or any(side not in ('base', 'head') for side in sides) or len(set(sides)) != len(sides):
              raise ValueError('invalid requested source sides')
          for name in sides:
              sha = os.environ[name.upper()]
              if not re.fullmatch('[0-9a-f]{40}', sha):
                  raise ValueError('invalid commit')
              url = os.environ['API'] + '/repos/' + os.environ['REPO'] + '/zipball/' + sha
              request = urllib.request.Request(url, headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN']})
              # urllib would forward Authorization across redirects. Follow the
              # authenticated API's redirect ourselves, with no credential.
              class NoRedirect(urllib.request.HTTPRedirectHandler):
                  def redirect_request(self, req, fp, code, msg, headers, newurl):
                      return None
              try:
                  response = urllib.request.build_opener(NoRedirect).open(request, timeout=60)
              except urllib.error.HTTPError as error:
                  if error.code != 302:
                      raise
                  location = error.headers['Location']
                  if not location.startswith('https://codeload.' + 'github.com/'):
                      raise ValueError('unexpected archive redirect')
                  response = urllib.request.urlopen(location, timeout=60)
              with response, open('sources/' + name + '.zip', 'xb') as output:
                  size = 0
                  while chunk := response.read(65536):
                      size += len(chunk)
                      if size > 100 * 1024 * 1024:
                          raise ValueError('source archive too large')
                      output.write(chunk)
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: factory-ios-sources
          path: sources/*.zip
          retention-days: 1
          if-no-files-found: error
  check:
    needs: sources
    strategy:
      fail-fast: false
      matrix:
        side: ${{ fromJSON(needs.sources.outputs.sides) }}
    runs-on: macos-15
    # Hosted hard ceiling only; Python enforces the transported remaining deadline.
    timeout-minutes: 360
    permissions: {}
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: factory-ios-sources
          path: sources
      # The embedded collector creates a fresh, non-admin build principal on
      # this disposable VM. Source runs only there, beneath deny-by-default
      # Seatbelt: no Internet/arbitrary local network, only exact readonly
      # prefetched registry IPC endpoints if needed. The Actions runner retains
      # collection/publication authority; no credential reaches source code.
      - name: Run new tests separately on base and head
        shell: /usr/bin/python3 -I {0}
        env:
          SIDE: ${{ matrix.side }}
          NONCE: ${{ inputs.nonce }}
          BASE: ${{ inputs.base }}
          HEAD: ${{ inputs.head }}
          TESTS: ${{ inputs.tests }}
          EXECUTION: ${{ inputs.execution }}
          EXECUTION_BUDGET_SECONDS: ${{ inputs.execution_budget_seconds }}
          EXECUTION_DEADLINE_UNIX_SECONDS: ${{ inputs.execution_deadline_unix_seconds }}
        run: |
          # FACTORY_RUNNER
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: factory-ios-result-${{ inputs.nonce }}-${{ matrix.side }}
          path: result.json
          retention-days: 1
          if-no-files-found: error
